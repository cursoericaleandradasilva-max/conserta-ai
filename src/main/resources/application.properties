# Configuracoes da aplicacao para producao na nuvem (Railway / Render / Fly.io)
spring.application.name=conserta-ai
server.port=${PORT:8080}

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Datasource: usa Postgres do Railway em producao, cai para H2 em arquivo localmente
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/consertaaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Dialeto dinamico: H2 localmente, Postgres em producao (definido via env var)
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Console H2 - habilite so localmente (defina H2_CONSOLE_ENABLED=false no Railway)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Actuator - healthcheck do Railway
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Documentacao OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Multipart (audio)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Chave da OpenAI - NUNCA hardcoded, sempre via env var
openai.api.key=${OPENAI_API_KEY:}