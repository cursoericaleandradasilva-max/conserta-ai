# Configuracoes da aplicacao para producao na nuvem (Railway / Render / Fly.io)
spring.application.name=conserta-ai
server.port=${PORT:8080}

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Banco H2 em arquivo (persiste dados entre reinicializacoes)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/consertaaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Console H2 (disponivel em /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Documentacao OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
